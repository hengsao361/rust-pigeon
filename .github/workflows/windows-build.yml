name: Windows build

on:
  workflow_dispatch:
    inputs:
      include_tesseract:
        description: Include Tesseract OCR in the portable ZIP
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Windows package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Set build version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $baseVersion = ($metadata.packages | Where-Object { $_.name -eq "rust-pigeon" } | Select-Object -First 1).version
          $fileVersion = "$baseVersion-build.${{ github.run_number }}"
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate embedded upload token
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          RUST_PIGEON_LOG_UPLOAD_TOKEN: ${{ secrets.RUST_PIGEON_LOG_UPLOAD_TOKEN }}
        run: |
          if ($env:RUST_PIGEON_LOG_UPLOAD_TOKEN.Length -lt 32) {
            throw "Repository secret RUST_PIGEON_LOG_UPLOAD_TOKEN is missing or shorter than 32 characters."
          }

      - name: Install Tesseract OCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_tesseract }}
        shell: pwsh
        run: |
          $tesseractPackageVersion = (Get-Content "TESSERACT_VERSION" -Raw).Trim()
          if ($tesseractPackageVersion -notmatch "^\d+\.\d+\.\d+\.\d+$") {
            throw "Invalid pinned Chocolatey Tesseract version: $tesseractPackageVersion"
          }

          choco install tesseract --version="$tesseractPackageVersion" --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install Tesseract package $tesseractPackageVersion"
          }
          $tesseractDir = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $tesseractExe = Join-Path $tesseractDir "tesseract.exe"
          $englishModel = Join-Path $tesseractDir "tessdata\eng.traineddata"

          if (-not (Test-Path $tesseractExe)) {
            throw "Tesseract executable was not installed at $tesseractExe"
          }

          if (-not (Test-Path $englishModel)) {
            throw "English OCR model was not installed at $englishModel"
          }

          & $tesseractExe --version
          "TESSERACT_DIR=$tesseractDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows package
        shell: pwsh
        env:
          RUST_PIGEON_LOG_UPLOAD_TOKEN: ${{ secrets.RUST_PIGEON_LOG_UPLOAD_TOKEN }}
        run: |
          if ("${{ github.event_name == 'workflow_dispatch' && inputs.include_tesseract }}" -eq "true") {
            .\scripts\package-windows.ps1 -BuildNumber "${{ github.run_number }}" -IncludeTesseract -TesseractDir $env:TESSERACT_DIR
            "PACKAGE_PATH=dist\rust-pigeon-windows-x64-v$env:FILE_VERSION.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
            "PACKAGE_NAME=rust-pigeon-windows-x64-v$env:FILE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            .\scripts\package-windows.ps1 -BuildNumber "${{ github.run_number }}"
            "PACKAGE_PATH=dist\rust-pigeon-v$env:FILE_VERSION.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
            "PACKAGE_NAME=rust-pigeon-v$env:FILE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Verify package contents
        shell: pwsh
        run: |
          $includeTesseract = "${{ github.event_name == 'workflow_dispatch' && inputs.include_tesseract }}" -eq "true"

          if ($includeTesseract) {
            $verifyDir = Join-Path $env:RUNNER_TEMP "rust-pigeon-package"
            Expand-Archive -Path $env:PACKAGE_PATH -DestinationPath $verifyDir -Force
            $requiredFiles = @(
              (Join-Path $verifyDir "rust-pigeon-v$env:FILE_VERSION.exe"),
              (Join-Path $verifyDir "tesseract\tesseract.exe"),
              (Join-Path $verifyDir "tesseract\tessdata\eng.traineddata"),
              (Join-Path $verifyDir "tesseract\PACKAGE_VERSION.txt"),
              (Join-Path $verifyDir "tesseract\VERSION.txt")
            )
          } else {
            $requiredFiles = @($env:PACKAGE_PATH)
            if (Get-ChildItem "dist" -Filter "*.zip") {
              throw "Default build must not produce a ZIP archive"
            }
          }

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Missing required package file: $file"
            }
          }

          if ($includeTesseract) {
            $expectedTesseractPackageVersion = (Get-Content "TESSERACT_VERSION" -Raw).Trim()
            $packagedTesseractPackageVersion = (Get-Content (Join-Path $verifyDir "tesseract\PACKAGE_VERSION.txt") -Raw).Trim()
            if ($packagedTesseractPackageVersion -ne $expectedTesseractPackageVersion) {
              throw "Packaged Tesseract version $packagedTesseractPackageVersion does not match pinned version $expectedTesseractPackageVersion"
            }
          }

          Get-Item $env:PACKAGE_PATH | Format-List FullName, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
